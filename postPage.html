<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--import axios -->
    <script src="./node_modules/axios/dist/axios.js"></script>
    <!--import bootstrap-->

    <link
      rel="stylesheet"
      href="./node_modules/bootstrap/dist/css/bootstrap.css"
    />
    <script src="./node_modules/bootstrap/dist/js/bootstrap.bundle.js"></script>
    <!--google fonts-->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bevan:ital@0;1&family=Datatype:wght@100..900&display=swap"
    />
    <!--import css style file-->
    <link rel="stylesheet" href="style.css" />

    <!--import js file-->
    
    <script src="./jsFiles/postPageDOM.js" defer></script>
    <script src="./jsFiles/apiRequeste.js" ></script>
    <script src="./jsFiles/common.js" defer></script>
    <!--web site picture-->
    <link rel="icon" href="./images/LetterT.png" />
    <!--// web site picture //-->

    <!--loading icon-->
    <script
      src="https://unpkg.com/@lottiefiles/dotlottie-wc@0.9.14/dist/dotlottie-wc.js"
      type="module"
    ></script>

    <!-- title of the page-->
    <title>final priject with tarmiz api</title>
  </head>

  <body>
    <!--loader -->
    <div class="hiddenScreen">
      <div class="animatedLoading">
          <dotlottie-wc
            src="https://lottie.host/92f4446f-0bb0-4aab-ba05-8445c1f1ae7f/bOGkZKQr11.lottie"
            style="width: 300px; height: 100px"
            class="mx-auto"
            autoplay
            loop
          >
          </dotlottie-wc>
        </div>

    </div>
    <!--loader -->
    <!--nav bar -->
    <header class="container">
      <div
        class="navBar d-flex flex-wrap flex-row rounded mt-2 justify-content-between align-items-center shadow-sm"
      >
        <div
          class="col-12 order-1 mt-1 col-sm-6 col-lg-4 order-lg-1 p-2 d-flex justify-content-center align-items-center"
        >
          <h2 class="text-uppercase rounded logo" aria-current="page" href="#">
            <a class="nav-link text-uppercase rounded" href="index.html">
              tarmmez
            </a>
            
          </h2>
        </div>
        
        <div
          id="loginElement"
          class="col-12 order-2 col-sm-4 order-sm-2 col-lg-4 order-lg-3 d-flex flex-nowrap justify-content-center justify-content-sm-end align-items-center mr-lg-2"
          id="loginOrRegesterDiv"
        >
          <div
            class="d-flex flex-row flex-nowrap align-items-center justify-content-center mx-2"
            id="profileNavBar"
          ></div>
          <button
            type="button"
            id="login_btn"
            class="nav_btn m-2"
            data-bs-toggle="modal"
            data-bs-target="#loginModal"
            data-bs-whatever="@mdo"
          >
            login<svg
              xmlns="http://www.w3.org/2000/svg"
              width="16"
              height="16"
              fill="currentColor"
              class="bi bi-box-arrow-in-right"
              viewBox="0 0 16 16"
            >
              <path
                fill-rule="evenodd"
                d="M6 3.5a.5.5 0 0 1 .5-.5h8a.5.5 0 0 1 .5.5v9a.5.5 0 0 1-.5.5h-8a.5.5 0 0 1-.5-.5v-2a.5.5 0 0 0-1 0v2A1.5 1.5 0 0 0 6.5 14h8a1.5 1.5 0 0 0 1.5-1.5v-9A1.5 1.5 0 0 0 14.5 2h-8A1.5 1.5 0 0 0 5 3.5v2a.5.5 0 0 0 1 0z"
              />
              <path
                fill-rule="evenodd"
                d="M11.854 8.354a.5.5 0 0 0 0-.708l-3-3a.5.5 0 1 0-.708.708L10.293 7.5H1.5a.5.5 0 0 0 0 1h8.793l-2.147 2.146a.5.5 0 0 0 .708.708z"
              />
            </svg>
          </button>
          <button
            type="button"
            id="regester_btn"
            class="nav_btn m-2"
            data-bs-toggle="modal"
            data-bs-target="#registerModal"
            data-bs-whatever="@mdo"
          >
            register
          </button>
          <button
            type="button"
            id="logout_btn"
            class="nav_btn"
            onclick="logoutuser()"
          >
            logout
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="16"
              height="16"
              fill="currentColor"
              class="bi bi-box-arrow-right"
              viewBox="0 0 16 16"
            >
              <path
                fill-rule="evenodd"
                d="M10 12.5a.5.5 0 0 1-.5.5h-8a.5.5 0 0 1-.5-.5v-9a.5.5 0 0 1 .5-.5h8a.5.5 0 0 1 .5.5v2a.5.5 0 0 0 1 0v-2A1.5 1.5 0 0 0 9.5 2h-8A1.5 1.5 0 0 0 0 3.5v9A1.5 1.5 0 0 0 1.5 14h8a1.5 1.5 0 0 0 1.5-1.5v-2a.5.5 0 0 0-1 0z"
              />
              <path
                fill-rule="evenodd"
                d="M15.854 8.354a.5.5 0 0 0 0-.708l-3-3a.5.5 0 0 0-.708.708L14.293 7.5H5.5a.5.5 0 0 0 0 1h8.793l-2.147 2.146a.5.5 0 0 0 .708.708z"
              />
            </svg>
          </button>
        </div>
      </div>
    </header>
    <!--// nav bar //-->
    

    <!--main page -->
    <div class="container">
      <div class="specificPost">
        <!--post-->

        <div class="card shadow my-3">
          <div
            class="card-header d-flex justify-content-center align-items-center"
          >
            <img class="authorPhoto rounded-circle" onerror="this.src='images/userPictur.jpg'" alt="user pictur" />
            <h5 class="authorText my-auto mx-1"></h5>
          </div>
          <div class="card-body d-flex justify-content-center flex-column">
            <img
              class="PostImage my-2 rounded border-2 mx-auto"
              
              alt=""
            />
            <div class="text-muted my-1"></div>
            <h5 class="card-title"></h5>
            <p class="card-text">
              
            </p>
            <hr />
            <div class="d-flex flex-wrap flex-row">
              <h6 class="commentElement px-2 py-1">
                <span>
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="16"
                    height="16"
                    fill="currentColor"
                    class="bi bi-pen"
                    viewBox="0 0 16 16"
                  >
                    <path
                      d="m13.498.795.149-.149a1.207 1.207 0 1 1 1.707 1.708l-.149.148a1.5 1.5 0 0 1-.059 2.059L4.854 14.854a.5.5 0 0 1-.233.131l-4 1a.5.5 0 0 1-.606-.606l1-4a.5.5 0 0 1 .131-.232l9.642-9.642a.5.5 0 0 0-.642.056L6.854 4.854a.5.5 0 1 1-.708-.708L9.44.854A1.5 1.5 0 0 1 11.5.796a1.5 1.5 0 0 1 1.998-.001m-.644.766a.5.5 0 0 0-.707 0L1.95 11.756l-.764 3.057 3.057-.764L14.44 3.854a.5.5 0 0 0 0-.708z"
                    />
                  </svg>
                </span>
                ( <span class="commentCount"></span> ) comments
              </h6>
              <div id="postTags" class="postTags d-flex"></div>
            </div>
            <div>
              <div>
                <div class="input-group mb-3">
                  <input
                    type="text"
                    class="form-control commentInput"
                    placeholder="§§ Add comment §§"
                    aria-label="Recipient’s username"
                    aria-describedby="button-addon2"
                  />
                  <button
                    class="nav_btn px-3"
                    type="button"
                    id="button-addon2"
                    onclick="createCommentUI()"
                  >
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-send" viewBox="0 0 16 16">
                      <path d="M15.854.146a.5.5 0 0 1 .11.54l-5.819 14.547a.75.75 0 0 1-1.329.124l-3.178-4.995L.643 7.184a.75.75 0 0 1 .124-1.33L15.314.037a.5.5 0 0 1 .54.11ZM6.636 10.07l2.761 4.338L14.13 2.576zm6.787-8.201L1.591 6.602l4.339 2.76z"/>
                    </svg>
                  </button>
                </div>
              </div>
              <div class="commentsDiv"></div>
            </div>
          </div>
        </div>
        <!--// post //-->
      </div>
    </div>
    <!--// main page //-->

    <!--modals bootstrap-->
    <!--loin modal-->
    <div
      class="modal fade"
      id="loginModal"
      tabindex="-1"
      aria-labelledby="exampleModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h1 class="modal-title fs-5" id="exampleModalLabel">LOGIN</h1>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <form>
              <div class="mb-3">
                <label for="recipient-name" class="col-form-label"
                  >username:</label
                >
                <input
                  type="text"
                  class="form-control usernameInput"
                  id="recipient-name"
                />
              </div>
              <div class="mb-3">
                <label for="password" class="col-form-label">password:</label>
                <input
                  type="password"
                  class="form-control passwordInput"
                  id="password"
                />
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              cancle
            </button>
            <button
              type="button"
              class="btn btn-primary"
              onclick="loginUserUI()"
            >
              LOGIN
            </button>
          </div>
        </div>
      </div>
    </div>
    <!--// loin modal //-->

    <!--register modal-->
    <div
      class="modal fade"
      id="registerModal"
      tabindex="-1"
      aria-labelledby="exampleModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h1 class="modal-title fs-5" id="exampleModalLabel">
              REGISTER NEW USER
            </h1>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <form>
              <div class="mb-3">
                <label for="recipient-name" class="col-form-label"
                  >NAME :</label
                >
                <input
                  type="text"
                  class="form-control registerNameInput"
                  id="recipient-name"
                />
              </div>
              <div class="mb-3">
                <label for="recipient-name" class="col-form-label"
                  >NAME :</label
                >
                <input
                  type="file"
                  class="form-control registerPicturUser"
                  id="recipient-name"
                />
              </div>
              <div class="mb-3">
                <label for="recipient-name" class="col-form-label"
                  >USERNAME :</label
                >
                <input
                  type="text"
                  class="form-control registerUsernameInput"
                  id="recipie-name"
                />
              </div>
              <div class="mb-3">
                <label for="password" class="col-form-label">PASSWORD :</label>
                <input
                  type="password"
                  class="form-control registerPasswordInput"
                  id="password"
                />
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              cancle
            </button>
            <button
              type="button"
              class="btn btn-primary"
              onclick="registerNewUserUI()"
            >
              REGISTER
            </button>
          </div>
        </div>
      </div>
    </div>
    <!--// register modal //-->
    <!--create new post modal-->
    <div
      class="modal fade"
      id="createPostModal"
      tabindex="-1"
      aria-labelledby="exampleModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h1 class="modal-title fs-5" id="exampleModalLabel">New Post</h1>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <form>
              <div class="mb-3">
                <label for="postTitle" class="col-form-label">Title :</label>
                <input type="text" class="form-control" id="postTitle" />
              </div>

              <div class="mb-3">
                <label for="picturTitle" class="col-form-label"> Picture</label>
                <input type="file" class="form-control" id="postPictor" />
              </div>

              <div class="mb-3">
                <label for="bodyPost" class="col-form-label"
                  >what do you think</label
                >
                <textarea class="form-control" id="bodyPost"></textarea>
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Close
            </button>
            <button
              type="button"
              class="btn btn-primary"
              onclick="createNewPostUI()"
            >
              Share
            </button>
          </div>
        </div>
      </div>
    </div>

    <!--// add button modal //-->

    <!--// modals bootstrap //-->
    <!--alerts-->
    <div id="liveAlertPlaceholder" class="alert_div fade show"></div>
    <!-- button to add post -->
    <button
      type="button"
      class="addPost_btn rounded-circle"
      data-bs-toggle="modal"
      data-bs-target="#createPostModal"
    >
      +
    </button>
    <!--//  button to add post //-->
  </body>
</html>
