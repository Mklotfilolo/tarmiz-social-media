    <!--modals bootstrap-->
    <!--loin modal-->
    <div
      class="modal fade"
      id="loginModal"
      tabindex="-1"
      aria-labelledby="exampleModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h1 class="modal-title fs-5" id="exampleModalLabel">LOGIN</h1>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <form>
              <div class="mb-3">
                <label for="recipient-name" class="col-form-label"
                  >username:</label
                >
                <input
                  type="text"
                  class="form-control usernameInput"
                  id="recipient-name"
                />
              </div>
              <div class="mb-3">
                <label for="password" class="col-form-label">password:</label>
                <input
                  type="password"
                  class="form-control passwordInput"
                  id="password"
                />
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              cancle
            </button>
            <button
              type="button"
              class="btn btn-primary"
              onclick="loginUserUI()"
            >
              LOGIN
            </button>
          </div>
        </div>
      </div>
    </div>
    <!--// loin modal //-->

    <!--register modal-->
    <div
      class="modal fade"
      id="registerModal"
      tabindex="-1"
      aria-labelledby="exampleModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h1 class="modal-title fs-5" id="exampleModalLabel">
              REGISTER NEW USER
            </h1>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <form>
              <div class="mb-3">
                <label for="recipient-name" class="col-form-label"
                  >NAME :</label
                >
                <input
                  type="text"
                  class="form-control registerNameInput"
                  id="recipient-name"
                />
              </div>
              <div class="mb-3">
                <label for="recipient-name" class="col-form-label"
                  >PICTURE :</label
                >
                <input
                  type="file"
                  class="form-control registerPicturUser"
                  id="recipient-name"
                />
              </div>
              <div class="mb-3">
                <label for="recipient-name" class="col-form-label"
                  >USERNAME :</label
                >
                <input
                  type="text"
                  class="form-control registerUsernameInput"
                  id="recipie-name"
                />
              </div>
              <div class="mb-3">
                <label for="password" class="col-form-label">PASSWORD :</label>
                <input
                  type="password"
                  class="form-control registerPasswordInput"
                  id="password"
                />
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              cancle
            </button>
            <button
              type="button"
              class="btn btn-primary"
              onclick="registerNewUserUI()"
            >
              REGISTER
            </button>
          </div>
        </div>
      </div>
    </div>
    <!--// register modal //-->
    <!--create new post modal-->
    <div
      class="modal fade"
      id="createPostModal"
      tabindex="-1"
      aria-labelledby="exampleModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h1 class="modal-title fs-5" id="exampleModalLabel">New Post</h1>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <form>
              <div class="mb-3">
                <label for="postTitle" class="col-form-label">Title :</label>
                <input type="text" class="form-control" id="postTitle" />
              </div>

              <div class="mb-3">
                <label for="picturTitle" class="col-form-label"> Picture</label>
                <input type="file" class="form-control" id="postPictor" />
              </div>

              <div class="mb-3">
                <label for="bodyPost" class="col-form-label"
                  >what do you think</label
                >
                <textarea class="form-control" id="bodyPost"></textarea>
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Close
            </button>
            <button
              type="button"
              class="btn btn-primary"
              onclick="createNewPostUI()"
            >
              Share
            </button>
          </div>
        </div>
      </div>
    </div>

    <!--// create new pos  //-->
    <!-- edite post modal -->
    <div
      class="modal fade"
      id="editePostModal"
      tabindex="-1"
      aria-labelledby="exampleModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content modal">
          <div class="modal-header">
            <h1 class="modal-title fs-5" id="exampleModalLabel">Edite post</h1>
          </div>
          <div class="modal-body">
            <form>
              <div class="mb-3">
                <label for="recipient-name" class="col-form-label"
                  >Title :</label
                >
                <input
                  type="text"
                  class="form-control titleEditePost"
                  id="recipient-name"
                />
              </div>
              <div class="mb-3">
                <label for="message-text" class="col-form-label">Body:</label>
                <textarea
                  class="form-control bodyEditePost"
                  id="message-text"
                ></textarea>
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-primary"
              onclick="editePostUI()"
            >
              Edite
            </button>
          </div>
        </div>
      </div>
    </div>

    <!--// edite post //-->
    <!-- delte conform mpdal-->
    <div
      class="modal fade"
      id="delteConformModal"
      tabindex="-1"
      aria-labelledby="exampleModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h1 class="modal-title fs-5" id="exampleModalLabel">Modal title</h1>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">Are sure you want to delete this post</div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Close
            </button>
            <button
              type="button"
              class="delteBtn"
              onclick="deletePostUI(deletePostID)"
            >
              Yes , Delete
            </button>
          </div>
        </div>
      </div>
    </div>
